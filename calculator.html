<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
      font-family: 'Segoe UI', sans-serif;
    }

    .calculator {
      background: #1e1e2e;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255,255,255,0.05);
      width: 320px;
    }

    .display {
      background: #13131f;
      border-radius: 16px;
      padding: 20px 24px 16px;
      margin-bottom: 20px;
      text-align: right;
      min-height: 100px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      overflow: hidden;
    }

    .display .expression {
      color: #6b7280;
      font-size: 14px;
      min-height: 20px;
      margin-bottom: 8px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .display .result {
      color: #f9fafb;
      font-size: 40px;
      font-weight: 300;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: font-size 0.1s;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      border: none;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 500;
      cursor: pointer;
      padding: 18px 0;
      transition: transform 0.08s, opacity 0.08s, background 0.1s;
      outline: none;
    }

    button:active {
      transform: scale(0.93);
      opacity: 0.85;
    }

    /* Number buttons */
    .btn-num {
      background: #2a2a3e;
      color: #e5e7eb;
    }

    .btn-num:hover {
      background: #33334d;
    }

    /* Operator buttons */
    .btn-op {
      background: #3b3b5c;
      color: #a78bfa;
    }

    .btn-op:hover {
      background: #454566;
    }

    /* Equals button */
    .btn-eq {
      background: linear-gradient(135deg, #7c3aed, #6d28d9);
      color: #fff;
      box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4);
    }

    .btn-eq:hover {
      background: linear-gradient(135deg, #8b5cf6, #7c3aed);
    }

    /* Clear / utility buttons */
    .btn-util {
      background: #3d2a2a;
      color: #f87171;
    }

    .btn-util:hover {
      background: #4d3333;
    }

    /* Zero button spans 2 columns */
    .span2 {
      grid-column: span 2;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="display">
      <div class="expression" id="expression"></div>
      <div class="result" id="result">0</div>
    </div>
    <div class="buttons">
      <button class="btn-util" onclick="clearAll()">AC</button>
      <button class="btn-util" onclick="toggleSign()">+/-</button>
      <button class="btn-util" onclick="percent()">%</button>
      <button class="btn-op"   onclick="inputOp('/')">÷</button>

      <button class="btn-num"  onclick="inputNum('7')">7</button>
      <button class="btn-num"  onclick="inputNum('8')">8</button>
      <button class="btn-num"  onclick="inputNum('9')">9</button>
      <button class="btn-op"   onclick="inputOp('*')">×</button>

      <button class="btn-num"  onclick="inputNum('4')">4</button>
      <button class="btn-num"  onclick="inputNum('5')">5</button>
      <button class="btn-num"  onclick="inputNum('6')">6</button>
      <button class="btn-op"   onclick="inputOp('-')">−</button>

      <button class="btn-num"  onclick="inputNum('1')">1</button>
      <button class="btn-num"  onclick="inputNum('2')">2</button>
      <button class="btn-num"  onclick="inputNum('3')">3</button>
      <button class="btn-op"   onclick="inputOp('+')">+</button>

      <button class="btn-num span2" onclick="inputNum('0')">0</button>
      <button class="btn-num"  onclick="inputDot()">.</button>
      <button class="btn-eq"   onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    let current = '0';
    let expression = '';
    let justCalculated = false;

    const resultEl = document.getElementById('result');
    const expressionEl = document.getElementById('expression');

    function updateDisplay() {
      resultEl.textContent = current;
      expressionEl.textContent = expression;
      // Shrink font if number is long
      resultEl.style.fontSize = current.length > 12 ? '24px' : current.length > 9 ? '30px' : '40px';
    }

    function inputNum(n) {
      if (justCalculated) {
        current = n;
        expression = '';
        justCalculated = false;
      } else {
        current = current === '0' ? n : current + n;
      }
      updateDisplay();
    }

    function inputDot() {
      if (justCalculated) { current = '0.'; expression = ''; justCalculated = false; }
      else if (!current.includes('.')) current += '.';
      updateDisplay();
    }

    function inputOp(op) {
      justCalculated = false;
      const opSymbols = { '/': '÷', '*': '×', '-': '−', '+': '+' };
      // Replace trailing operator if present
      expression = expression.replace(/[+\-*/]$/, '');
      expression += current + ' ' + opSymbols[op] + ' ';
      current = '0';
      updateDisplay();
    }

    function calculate() {
      if (!expression) return;
      try {
        // Convert display expression back to evaluable form
        const raw = expression.replace(/÷/g, '/').replace(/×/g, '*').replace(/−/g, '-') + current;
        let res = Function('"use strict"; return (' + raw + ')')();
        // Round to avoid floating point noise
        res = parseFloat(res.toPrecision(12));
        expressionEl.textContent = expression + current + ' =';
        expression = '';
        current = String(res);
        justCalculated = true;
        updateDisplay();
      } catch (e) {
        current = 'Error';
        expression = '';
        updateDisplay();
      }
    }

    function clearAll() {
      current = '0';
      expression = '';
      justCalculated = false;
      updateDisplay();
    }

    function toggleSign() {
      if (current !== '0') current = current.startsWith('-') ? current.slice(1) : '-' + current;
      updateDisplay();
    }

    function percent() {
      current = String(parseFloat(current) / 100);
      updateDisplay();
    }

    // Keyboard support
    document.addEventListener('keydown', e => {
      if (e.key >= '0' && e.key <= '9') inputNum(e.key);
      else if (e.key === '.') inputDot();
      else if (['+', '-', '*', '/'].includes(e.key)) inputOp(e.key);
      else if (e.key === 'Enter' || e.key === '=') calculate();
      else if (e.key === 'Backspace') {
        if (current.length > 1) current = current.slice(0, -1);
        else current = '0';
        updateDisplay();
      }
      else if (e.key === 'Escape') clearAll();
      else if (e.key === '%') percent();
    });
  </script>
</body>
</html>
